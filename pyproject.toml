[project]
name = "apertus-common"
version = "0.2.0"
description = "Typed reference library for the Apertus 2 conversation format"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "tokenizers>=0.23.2,<0.24",
]

[project.optional-dependencies]
hf = ["transformers>=5.16"]

# Loaded by vLLM at start-up; registers the `apertus2` tokenizer mode, renderer,
# reasoning parser and tool parser (see src/apertus_common/vllm/__init__.py).
[project.entry-points."vllm.general_plugins"]
apertus2 = "apertus_common.vllm:register"

[project.urls]
Repository = "https://github.com/swiss-ai/apertus-common"
Documentation = "https://github.com/swiss-ai/apertus-common#readme"
Issues = "https://github.com/swiss-ai/apertus-common/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apertus_common"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude/**", "/AGENTS.md", "/CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
# The vLLM integration is typed against vLLM, which the dev environment cannot
# install (Linux-only wheels); it is checked by its tests in a vLLM container.
exclude = ["src/apertus_common/vllm/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pyright]
include = ["src", "scripts"]
exclude = ["src/apertus_common/vllm"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF", "TRY"]
# TRY003: inline messages are the pydantic-validator idiom.
ignore = ["TRY003"]

[dependency-groups]
dev = [
    "transformers>=5.16",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-jsonschema>=4.26.0.20260518",
]
